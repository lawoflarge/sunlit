name: Sunlit
options:
  bundleIdPrefix: com.levinschwab
  # The ten storefront languages. Without knownRegions Xcode extracts the strings
  # but offers nowhere to translate them, and the app falls back to the English
  # defaultValue on every screen while the store sells it in ten languages.
  developmentLanguage: en
  knownRegions: [en, de, fr, it, es, es-MX, nl, pl, ja, pt-BR]
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: R95M36AU2X
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Sunlit:
    type: application
    platform: iOS
    sources:
      # A bare source path files every unknown extension into the Resources build
      # phase, which is how a StoreKit *test* configuration once shipped inside a
      # released binary in this portfolio. Exclude it here and add it back with no
      # build phase so the scheme can still use it for local StoreKit testing.
      - path: Sources/Sunlit
        excludes:
          - "**/*.storekit"
      - path: Sources/Sunlit/Features/Paywall/Sunlit.storekit
        buildPhase: none
      # The offline city list. Named explicitly rather than swept up by the
      # source path above, because the build script asserts it is in the bundle
      # and a resource that arrives by accident can leave the same way.
      - path: Sources/Sunlit/Resources/Cities/cities.bin
        buildPhase: resources
    dependencies:
      - target: SunlitCore
      - target: SunlitWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.sunlit
        PRODUCT_NAME: Sunlit
        # iPhone only, on purpose. An iPad-capable binary makes Apple demand an
        # iPad screenshot set and judge an iPad layout, and four apps in this
        # portfolio were rejected under 5.6 for exactly that. This is also forced
        # on the xcodebuild command line in scripts/build.sh, because xcodegen has
        # silently dropped it before.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Sunlit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Manual on purpose. Automatic signing asks for an iOS DEVELOPMENT profile
        # when it runs headless, this team has no registered devices, and the
        # archive then dies with "no devices". Do NOT pass -allowProvisioningUpdates
        # either: it overrides Manual and picks the development certificate.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Sunlit App Store"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  SunlitCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SunlitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.sunlit.core
        PRODUCT_NAME: SunlitCore
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  SunlitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/SunlitWidgets
    dependencies:
      - target: SunlitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.sunlit.widgets
        PRODUCT_NAME: SunlitWidgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/SunlitWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Sunlit Widgets App Store"
        SKIP_INSTALL: YES
  SunlitCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SunlitCoreTests
    dependencies:
      - target: SunlitCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.sunlit.coretests
  SunlitAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SunlitAppTests
    dependencies:
      - target: Sunlit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.sunlit.apptests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sunlit.app/Sunlit"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Sunlit:
    build:
      targets:
        Sunlit: all
        SunlitCore: all
        SunlitWidgets: all
        SunlitCoreTests: [test]
        SunlitAppTests: [test]
    test:
      targets:
        - SunlitCoreTests
        - SunlitAppTests
      gatherCoverageData: true
